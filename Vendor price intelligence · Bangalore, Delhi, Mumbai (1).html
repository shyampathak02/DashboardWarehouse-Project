 const tot={};Object.values(m).forEach(s=>tot[s.loc]=(tot[s.loc]||0)+s.spend);return Object.values(m).map(s=>({...s,n:s.items.size,pct:s.spend/tot[s.loc]}))}
const supOut=L=>({head:['Location','Supplier','Supplier code','Items supplied','Purchase lines','Spend incl. GST (₹)','% of location spend','Items where cheapest','Items where costlier','Sole-source items'],rows:L.slice().sort((a,b)=>a.loc.localeCompare(b.loc)||b.spend-a.spend).map(s=>[LN[s.loc],s.sup,s.sc,s.n,s.lines,n2(s.spend),n2(s.pct*100),s.ch.size,s.co.size,s.sole.size])});
const itemCols=()=>[{h:'Item',f:x=>`<b>${esc(x.g.item)}</b> <span class="mut">${esc(x.g.sku)}</span>`,v:x=>x.g.item},{h:'Category',f:x=>esc(x.g.cat),v:x=>x.g.cat},{h:'Supplier unit',f:x=>esc(x.r.su),v:x=>x.r.su},{h:'Inv. unit',f:x=>esc(x.g.iu),v:x=>x.g.iu},{h:'Rate / inv. unit',f:x=>f2(x.r.v),v:x=>x.r.v,n:1},{h:'Rank',f:x=>(x.g.rows.indexOf(x.r)+1)+' of '+x.g.rows.length,v:x=>x.g.rows.indexOf(x.r),n:1},{h:'Cheapest for item',f:x=>x.r.sc===x.g.lo.sc?'<span class="tag g">This supplier</span>':esc(x.g.lo.sup),v:x=>x.g.lo.sup},{h:'Qty',f:x=>(+x.r.iq).toLocaleString('en-IN',{maximumFractionDigits:2}),v:x=>x.r.iq,n:1},{h:'Spend',f:x=>f0(x.r.amt),v:x=>x.r.amt,n:1},{h:'Lines',f:x=>x.r.lines,v:x=>x.r.lines,n:1}];
const outH=['Location','Supplier','Supplier code','Item','SKU','Category','Inventory unit','Supplier unit','Rate before GST per inv. unit (₹)','GST %','Landed rate incl. GST per inv. unit (₹)','Comparable rate, selected basis (₹)','Quantity (inv. unit)','Spend incl. GST (₹)','Purchase lines','Price rank','Suppliers for item','Cheapest supplier for item','Premium vs cheapest % (unit-checked items only)','Source'],
 rowOut=(s,x)=>[LN[s.loc],s.sup,s.sc,x.g.item,x.g.sku,x.g.cat,x.g.iu,x.r.su,n2(x.r.pre),n2(x.r.gstp*100),n2(x.r.landed),n2(x.r.v),n2(x.r.iq),n2(x.r.amt),x.r.lines,x.g.rows.indexOf(x.r)+1,x.g.rows.length,x.g.lo.sup,x.g.cmp?n2((x.r.v/x.g.lo.v-1)*100):'',SNAP.locations.find(l=>l.code===s.loc).file+' / Supplier Wise Data / row '+x.r.row];
function supModal(){const L=supRows(),names=new Set(L.map(s=>s.sup.toLowerCase())).size;window.SMR=L;
 modal('Suppliers by location',`<div class="row" style="padding:0 0 6px"><div class="seg">${[['ALL','All locations'],['BLR','Bangalore'],['DEL','Delhi'],['MUM','Mumbai']].map(([k,t])=>`<button class="${SM.loc===k?'on':''}" onclick="SM.loc='${k}';SM.sel=null;supModal()">${t}</button>`).join('')}</div></div>
 <p class="sub">${names} distinct suppliers, ${L.length} supplier–location pairs (a vendor serving two locations appears once per location, with that location's own rates). The top-bar category and search filters apply. Click a supplier to see the items it provides.</p>`+
 table('sm',[{h:'Location',f:s=>`<span style="color:var(--${s.loc})">●</span> ${LN[s.loc]}`,v:s=>s.loc},{h:'Supplier',f:s=>`<b>${esc(s.sup)}</b>`,v:s=>s.sup},{h:'Code',f:s=>esc(s.sc),v:s=>s.sc},{h:'Items',f:s=>s.n,v:s=>s.n,n:1},{h:'Lines',f:s=>s.lines,v:s=>s.lines,n:1},{h:'Spend',f:s=>f0(s.spend),v:s=>s.spend,n:1},{h:'% of location spend',f:s=>pc(s.pct),v:s=>s.pct,n:1},{h:'Cheapest on',f:s=>s.ch.size,v:s=>s.ch.size,n:1},{h:'Costlier on',f:s=>s.co.size,v:s=>s.co.size,n:1},{h:'Sole-source',f:s=>s.sole.size,v:s=>s.sole.size,n:1}],L,s=>{SM.sel=s.k;showSup()},300,()=>supOut(window.SMR))+'<div id="smd" style="margin-top:14px"></div>');
 TB.sm.sort=5;TB.sm.dir=-1;draw('sm');if(SM.sel&&L.some(s=>s.k===SM.sel))showSup()}
function showSup(){const s=window.SMR.find(x=>x.k===SM.sel);if(!s)return;$('smd').innerHTML=`<div class="card"><h3>${esc(s.sup)} · ${LN[s.loc]} · ${s.n} item${s.n>1?'s':''}, ${f0(s.spend)}</h3>${table('smi',itemCols(),s.rows,x=>openItem(x.g.k),300,()=>({head:outH,rows:s.rows.slice().sort((a,b)=>b.r.amt-a.r.amt).map(x=>rowOut(s,x))}))}</div>`;TB.smi.sort=8;TB.smi.dir=-1;draw('smi');$('smd').scrollIntoView({behavior:'smooth',block:'nearest'})}
/* ---------- router ---------- */
const INIT={overview:overviewInit,trends:trendInit,locations:locInit,suppliers:supInit,savings:savInit};
function render(){const P={overview:pOverview,items:pItems,trends:pTrends,locations:pLocations,suppliers:pSuppliers,savings:pSavings,quality:pQuality};Object.values(CH).forEach(c=>c.destroy());CH={};
 $('main').innerHTML=P[S.page]();{const h=$('main').querySelector(':scope>h2'),sb=$('main').querySelector(':scope>.sub');if(h){$('ptitle').innerHTML=h.innerHTML;h.remove()}if(sb){$('psub').innerHTML=sb.innerHTML;sb.remove()}else $('psub').textContent=''}Object.keys(TB).forEach(draw);(INIT[S.page]||(()=>{}))();decorate($('main'));$('nav').innerHTML=PAGES.map(([k,t])=>`<button class="${S.page===k?'on':''}" onclick="go('${k}')" title="${t}" ${S.page===k?'aria-current="page"':''}><svg viewBox="0 0 24 24" aria-hidden="true">${IC[k]}</svg><span class="lb">${t}</span></button>`).join('');
 $('loc').innerHTML=[['ALL','Consolidated'],['BLR','Bangalore'],['DEL','Delhi'],['MUM','Mumbai']].map(([k,t])=>`<button class="${S.loc===k?'on':''}" data-k="${k}">${t}</button>`).join('')}
function go(p){S.page=p;closeM();render();location.hash='/'+p;window.scrollTo(0,0)}
/* ---------- boot ---------- */
function init(snap){R=snap.rows;build();if(window.claude&&claude.use)claude.use('downloads').then(d=>{DL=d;if(!d)document.body.classList.add('nodl')}).catch(()=>document.body.classList.add('nodl'));$('src').textContent=provider.name+' · refreshed '+snap.generated;$('cat').innerHTML='<option value="">All categories</option>'+[...new Set(R.map(r=>r.cat))].sort().map(c=>`<option>${esc(c)}</option>`).join('');
 S.page=(location.hash.slice(2)||'overview');if(!PAGES.some(p=>p[0]===S.page))S.page='overview';
 $('loc').onclick=e=>{if(e.target.dataset.k){S.loc=e.target.dataset.k;render()}};let tm;$('q').oninput=e=>{S.q=e.target.value;clearTimeout(tm);tm=setTimeout(render,200)};$('cat').onchange=e=>{S.cat=e.target.value;render()};
 $('basis').onchange=e=>{S.basis=e.target.value;build();render()};$('range').onchange=e=>{S.range=e.target.value;$('cust').style.display=S.range==='c'?'':'none';render()};$('d1').onchange=e=>{S.d1=e.target.value;render()};$('d2').onchange=e=>{S.d2=e.target.value;render()};
 $('reset').onclick=()=>{Object.assign(S,{loc:'ALL',q:'',cat:'',basis:'landed',range:'180',d1:'',d2:''});$('q').value='';$('cat').value='';$('basis').value='landed';$('range').value='180';$('cust').style.display='none';build();render()};
 $('theme').onclick=()=>{const d=document.documentElement;d.dataset.theme=d.dataset.theme==='light'?'dark':'light';render()};
 try{if(localStorage.getItem('sbc'))$('app').classList.add('c')}catch(e){}$('collapse').setAttribute('aria-expanded',!$('app').classList.contains('c'));$('collapse').onclick=()=>{const a=$('app'),c=a.classList.toggle('c');$('collapse').setAttribute('aria-expanded',!c);try{localStorage.setItem('sbc',c?'1':'')}catch(e){}};
 $('modal').onclick=e=>{if(e.target.id==='modal')closeM()};$('drawer').onclick=e=>{if(e.target.id==='drawer')closeM()};document.onkeydown=e=>{if(e.key==='Escape')closeM()};window.onhashchange=()=>{const p=location.hash.slice(2);if(p!==S.page&&PAGES.some(x=>x[0]===p)){S.page=p;render()}};render()}
provider.load().then(init).catch(e=>{$('main').innerHTML=`<div class="note"><b>Data could not be loaded.</b> ${esc(e.message)} The last successful source was the Excel snapshot.</div>`;console.error(e)});
